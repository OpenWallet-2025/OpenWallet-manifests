{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openwallet-ingress.fullname" . }}
  namespace: openwallet
  annotations:
    kubernetes.io/ingress.class: "{{ .Values.ingress.className }}"
    kubernetes.io/ingress.global-static-ip-name: "{{ .Values.ingress.staticIP }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.frontend.serviceName }}
                port:
                  number: {{ .Values.ingress.frontend.servicePort }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.backend.serviceName }}
                port:
                  number: {{ .Values.ingress.backend.servicePort }}
{{- end }}

