{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openwallet-backend.fullname" . }}
  namespace: openwallet
  labels:
{{- include "openwallet-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}  # [수정참고] values 구조에 따라 .Values.backend.replicaCount 일 수 있음 확인 필요
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
{{- include "openwallet-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "openwallet-backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}

          # [중요] 아래 항목들은 ports와 같은 세로선(들여쓰기)에 위치해야 합니다.
          
          # 1. 헬스 체크
          startupProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              # [핵심] 님 서버가 확실하게 대답해줄 수 있는 유일한 주소입니다.
              path: /api/swagger-ui/index.html
              port: 8080
            # [핵심] 서버 켜지는 데 41초 걸린다고 하셨으니, 
            # 60초 동안은 헬스체크 하지 말고 그냥 기다리라고 설정합니다.
            initialDelaySeconds: 60 
            periodSeconds: 10
            failureThreshold: 10    # 10번이나 실패해야 죽은 걸로 쳐라 (매우 관대하게)
            timeoutSeconds: 5

          # 2. 환경 변수
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.backend.env.dbUrl }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.backend.env.dbUsername }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.backend.env.dbPassword | quote }}
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: {{ .Values.backend.contextPath }}

          # 3. 리소스 설정
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}