backendend:
  fullnameOverride: openwallet-backend-server
  enabled: true

  # Deployment 설정
  image:
    repository: jaejeong999/openwallet-be
    tag: "v1"
    pullPolicy: Always
  replicaCount: 1
  port: 8080

  env:
    db-url: "jdbc:mysql://10.123.144.3:3306/openwallet-db?useSSL=false&allowPublicKeyRetrieval=true"
    db-user-name: "openwallet"
    db-password: "openwallet1234"

 
  # Service 설정
  service:
    name: backend-server
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi" # 최소 보장
      cpu: "250m"
    limits:
      memory: "1Gi"   # 넘으면 강제 종료 (OOMKilled)
      cpu: "500m"

  



