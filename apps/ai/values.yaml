ai:
  fullnameOverride: openwallet-ai-server
  enabled: true
  image:
    repository: ghcr.io/openwallet-2025/ai
    tag: 0ba1e35
    pullPolicy: Always
  command:
    - /bin/sh
    - '-c'
  args:
    - |
      echo "Waiting for Cloud SQL Proxy (127.0.0.1:3306)..."

      # 최대 30번 시도 (약 60초 대기)
      RETRIES=30

      # Python을 이용해 3306 포트 연결 시도 (nc 명령어 대체)
      while ! python -c "import socket; s = socket.create_connection(('127.0.0.1', 3306), timeout=1)" 2>/dev/null; do
        
        # 횟수 차감 및 체크
        RETRIES=$((RETRIES-1))
        if [ $RETRIES -le 0 ]; then
          echo "❌ Error: Timed out waiting for Database connection!"
          exit 1
        fi
        
        echo "⏳ Proxy not ready yet... retrying ($RETRIES left)"
        sleep 2

      done

      echo "✅ Proxy is up! Starting FastAPI..."

      # 원래 실행하려던 명령어 실행
      uvicorn main:app --host 0.0.0.0 --port 8000
  replicaCount: 1
  port: 8000
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 20
    failureThreshold: 30
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
  env:
    dbUrl: jdbc:mysql://10.123.144.3:3306/openwallet-db?useSSL=false&allowPublicKeyRetrieval=true
    dbUsername: openwallet
    dbPassword: openwallet1234
  proxy:
    name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
    args:
      - '--private-ip'
      - my-project:asia-northeast3:openwallet-db
      - '--port=3306'
  runAsNonRoot: true
  resources:
    requests:
      cpu: '2'
      memory: 16Gi
      ephemeral-storage: 8Gi
    limits:
      cpu: '2'
      memory: 16Gi
      ephemeral-storage: 8Gi
  service:
    name: ai-server
    port: 8000
    targetPort: 8000
image:
  repository: ghcr.io/OpenWallet-2025/ai
  tag: 435fb3f
