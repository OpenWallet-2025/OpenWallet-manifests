{{- if .Values.ai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openwallet-ai.fullname" . }}
  namespace: openwallet
  labels:
{{- include "openwallet-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ai.replicaCount }}  
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
{{- include "openwallet-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "openwallet-ai.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ai-server
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Cloud SQL Proxy (127.0.0.1:3306)..."
              
              # 최대 30번 시도 (약 60초 대기)
              RETRIES=30
              
              # Python을 이용해 3306 포트 연결 시도 (nc 명령어 대체)
              while ! python -c "import socket; s = socket.create_connection(('127.0.0.1', 3306), timeout=1)" 2>/dev/null; do
                
                # 횟수 차감 및 체크
                RETRIES=$((RETRIES-1))
                if [ $RETRIES -le 0 ]; then
                  echo "❌ Error: Timed out waiting for Database connection!"
                  exit 1
                fi
                
                echo "⏳ Proxy not ready yet... retrying ($RETRIES left)"
                sleep 2
              
              done
              
              echo "✅ Proxy is up! Starting FastAPI..."
              
              # 원래 실행하려던 명령어 실행
              uvicorn main:app --host 0.0.0.0 --port 8000
  replicaCount: 1
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ai.port }}
          livenessProbe:
{{- toYaml .Values.ai.livenessProbe | nindent 12 }}
          startupProbe:
{{- toYaml .Values.ai.startupProbe | nindent 12 }}
         
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/key.json"
          
          volumeMounts:
            - name: google-cloud-key
              mountPath: "/var/secrets/google"
              readOnly: true
          

          resources:
              {{- toYaml .Values.ai.resources | nindent 12 }}
              
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--private-ip"
            - "my-project:asia-northeast3:openwallet-db"
            - "--port=3306"
          securityContext:
            runAsNonRoot: true
        

      volumes:
        - name: google-cloud-key
          secret:
            secretName: gcp-auth-key
{{- end }}