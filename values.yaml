frontend:
  fullnameOverride: openwallet-frontend-server
  enabled: true

  # Deployment 설정
  image: jaejeong999/nginx-front:4
  replicaCount: 3
  port: 80

  # NGINX configMap 설정
  configMapName: openwallet-front-config
  configFile: default.conf

  # Service 설정
  service:
    name: front-server
    port: 80
    targetPort: 80


