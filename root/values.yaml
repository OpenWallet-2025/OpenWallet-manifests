env: dev

git:
  repoURL: https://github.com/OpenWallet-2025/OpenWallet-manifests

  targetRevision: develop   # ← feature/test/dev branch 등 환경별 변경되는 브랜치

destination:
  namespace: openwallet

applications:
  frontend:
    enabled: true
    name: openwallet-frontend-dev
    path: apps/frontend
    helm:
      releaseName: openwallet-frontend-dev

  backend:
    enabled: true
    name: openwallet-backend-dev
    path: apps/backend
    helm:
      releaseName: openwallet-backend-dev

  ai:
    enabled: true
    name: openwallet-ai-dev
    path: apps/ai
    helm:
      releaseName: openwallet-ai-dev

  ingress:
    enabled: true
    name: openwallet-ingress-dev
    path: infra/ingress
    helm:
        releaseName: openwallet-ingress-dev
