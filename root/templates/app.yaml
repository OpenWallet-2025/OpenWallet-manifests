{{- if .Values.applications.frontend.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.applications.frontend.name }}
  namespace: argocd
spec:
  project: openwallet
  source:
    repoURL: {{ .Values.git.repoURL }}
    path: apps/frontend
    targetRevision: {{ .Values.git.targetRevision }}
    
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.destination.namespace }}
---
{{- end }}

